<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Karachi Run · Movement Practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#123e43;color:#fff6dc;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}header,footer{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));z-index:2;pointer-events:none}header{top:max(12px,env(safe-area-inset-top));text-shadow:0 2px 3px #153b3e}h1{font-size:clamp(22px,5vw,34px);margin:0;color:#ffd264;font-style:italic}p{margin:5px 0;font-size:13px;font-weight:650}footer{bottom:max(12px,env(safe-area-inset-bottom));display:grid;justify-items:center;gap:9px}nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;pointer-events:auto}button,a{font:800 12px system-ui;border:2px solid #fff0b7;border-radius:12px;background:#155e64;color:#fff6dc;padding:11px 13px;box-shadow:0 4px 0 #12393d;text-decoration:none;cursor:pointer;touch-action:manipulation}button[aria-pressed=true],#start{background:#ffc54c;color:#244448;border-color:#fff0b7}button:disabled{opacity:.5}#hint{background:#17484bd9;padding:9px 15px;border-radius:12px;font-size:13px;text-align:center;max-width:440px}#loading{position:fixed;inset:0;z-index:3;background:#123e43;display:grid;place-content:center;text-align:center}#loading.hidden{display:none}#readout{font-variant-numeric:tabular-nums}#keys button{font-size:18px;min-width:50px}#keys{display:none}@media(pointer:coarse){#keys{display:flex}}@media(max-height:450px){header p{display:none}footer{gap:5px}button,a{padding:8px 10px}#hint{padding:5px 10px}#keys{display:none}}
</style></head><body>
<canvas id="world" tabindex="0" aria-label="Movement practice. Swipe or use arrows to change lanes, jump and roll."></canvas>
<header><h1>KARACHI RUN · PRACTICE</h1><p>A 45-second movement course. Your wallet and cloud save are untouched.</p><p id="readout">Getting ready…</p></header>
<footer><div id="hint" role="status">Compare the new sprint with the previous movement.</div><nav><button id="clip" aria-pressed="true">NEW SPRINT</button><button id="legacy" aria-pressed="false">PREVIOUS</button><button id="camera">SIDE VIEW</button><button id="start" disabled>START COURSE ▶</button><a href="/">FULL GAME ↗</a></nav><nav id="keys"><button data-action="left" aria-label="Left">←</button><button data-action="jump" aria-label="Jump">↑</button><button data-action="slide" aria-label="Roll">↓</button><button data-action="right" aria-label="Right">→</button></nav></footer>
<div id="loading"><h1>WAKING UP KARACHI</h1><p>Loading the movement course…</p></div>
<script type="module" src="/src/movement-lab.ts"></script></body></html>
